<svg width="400" height="260" viewBox="0 0 680 260" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>A.T. Johnson Photography logo</title>
  <desc>A camera aperture iris design with the text A.T. Johnson Photography</desc>

  <rect width="680" height="260" fill="#ffffff"/>

  <defs>
    <style>
      .logo-name { font-family: Georgia, 'Times New Roman', serif; font-size: 38px; font-weight: 700; fill: #1a1a1a; letter-spacing: 3px; }
      .logo-sub  { font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: 400; fill: #555555; letter-spacing: 8px; }
    </style>
  </defs>

  <circle cx="340" cy="104" r="76" fill="none" stroke="#2c2c2c" stroke-width="3"/>

  <g transform="translate(340,104)">
    <ellipse cx="0" cy="-28" rx="18" ry="38" fill="#2c2c2c" opacity="0.85" transform="rotate(0)"/>
    <ellipse cx="0" cy="-28" rx="18" ry="38" fill="#2c2c2c" opacity="0.85" transform="rotate(60)"/>
    <ellipse cx="0" cy="-28" rx="18" ry="38" fill="#2c2c2c" opacity="0.85" transform="rotate(120)"/>
    <ellipse cx="0" cy="-28" rx="18" ry="38" fill="#2c2c2c" opacity="0.85" transform="rotate(180)"/>
    <ellipse cx="0" cy="-28" rx="18" ry="38" fill="#2c2c2c" opacity="0.85" transform="rotate(240)"/>
    <ellipse cx="0" cy="-28" rx="18" ry="38" fill="#2c2c2c" opacity="0.85" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="20" fill="#c9a84c" opacity="0.9"/>
  </g>

  <circle cx="340" cy="104" r="62" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>

  <text x="340" y="208" text-anchor="middle" class="logo-name">A.T. JOHNSON</text>
  <text x="340" y="238" text-anchor="middle" class="logo-sub">PHOTOGRAPHY</text>
</svg>